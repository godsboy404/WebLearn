<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Binggle</title>
		<meta name="description" content="Google mimic without third-party frameworks" />
		<style>
			/* Reset and base styles */
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			
			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				background-color: #f9fafb;
				color: #1f2937;
				background-image: url('https://bing.biturl.top/?resolution=UHD&format=image&index=0&mkt=zh-CN');
				background-size: cover;
				background-position: center;
				background-attachment: fixed;
			}
			
			/* Header styles */
			header {
				width: 100%;
			}
			
			nav {
				max-width: 96rem;
				margin: 0 auto;
				padding: 1rem;
				display: flex;
				align-items: center;
				justify-content: flex-end;
				gap: 1rem;
				font-size: 0.875rem;
			}
			
			/* Main content styles */
			main {
				flex-grow: 1;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			
			.search-container {
				width: 100%;
				max-width: 42rem;
				padding: 1.5rem;
				text-align: center;
				background-color: rgba(255, 255, 255, 0.7);
				backdrop-filter: blur(8px);
				border-radius: 0.5rem;
				padding: 2.5rem;
				box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
			}
			
			/* Logo styles */
			.logo-letter {
				font-weight: 700;
				font-size: 96px;
				line-height: 1;
			}
			
			/* Search form styles */
			form {
				margin-bottom: 1.5rem;
			}
			
			.search-input-container {
				display: flex;
				align-items: center;
				border: 1px solid #e5e7eb;
				border-radius: 9999px;
				box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
				padding: 0.75rem 1rem;
				transition: box-shadow 0.15s ease-in-out;
			}
			
			.search-input-container:hover {
				box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
			}
			
			.search-input-container:focus-within {
				box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
				outline: 2px solid #93c5fd;
				outline-offset: 2px;
			}
			
			.search-input {
				flex-grow: 1;
				border: none;
				outline: none;
				font-size: 1.125rem;
			}
			
			/* Button styles */
			.btn {
				padding: 0.5rem 1rem;
				border-radius: 0.375rem;
				font-size: 0.875rem;
				transition: all 0.15s ease-in-out;
			}
			
			.btn-primary {
				background-color: #2563eb;
				color: white;
			}
			
			.btn-primary:hover {
				background-color: #1d4ed8;
			}
			
			.btn-secondary {
				background-color: #f3f4f6;
			}
			
			.btn-secondary:hover {
				box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
			}
			
			.btn:focus {
				outline: 2px solid #93c5fd;
				outline-offset: 2px;
			}
			
			/* Icon button styles */
			.icon-btn {
				padding: 0.5rem;
				border-radius: 50%;
				background: none;
				border: none;
				cursor: pointer;
				transition: background-color 0.15s ease-in-out;
			}
			
			.icon-btn:hover {
				background-color: #f3f4f6;
			}
			
			.icon-btn:focus {
				outline: 2px solid #93c5fd;
				outline-offset: 2px;
			}
			
			/* Footer styles */
			footer {
				background-color: #f9fafb;
				border-top: 1px solid #e5e7eb;
			}
			
			.footer-content {
				max-width: 96rem;
				margin: 0 auto;
				padding: 1rem;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				align-items: center;
				font-size: 0.875rem;
				color: #374151;
			}
			
			@media (min-width: 640px) {
				.footer-content {
					flex-direction: row;
				}
			}
			
			.footer-links {
				display: flex;
				gap: 1rem;
				margin-bottom: 0.75rem;
			}
			
			@media (min-width: 640px) {
				.footer-links {
					margin-bottom: 0;
				}
			}
			
			/* Link styles */
			a {
				color: inherit;
				text-decoration: none;
			}
			
			a:hover {
				text-decoration: underline;
			}
			
			/* Utility classes */
			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border-width: 0;
			}
			
			.select-none {
				-webkit-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
				user-select: none;
			}
			
			.flex-shrink-0 {
				flex-shrink: 0;
			}
			
			/* Color classes */
			.text-blue-600 { color: #2563eb; }
			.text-red-500 { color: #ef4444; }
			.text-yellow-400 { color: #facc15; }
			.text-green-500 { color: #22c55e; }
			.text-gray-700 { color: #374151; }
			.text-gray-500 { color: #6b7280; }
			.text-white { color: #ffffff; }
			
			/* Responsive styles */
			@media (max-width: 640px) {
				.logo-letter { font-size: 56px; }
				.search-container { padding: 1.5rem; }
			}
			
			/* Search buttons container */
			.search-buttons {
				margin-top: 1.5rem;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.75rem;
			}
			
			/* Quote text */
			.quote {
				font-size: 0.75rem;
				color: #6b7280;
			}
			
			/* Logo container */
			.logo-container {
				user-select: none;
			}
		</style>
	</head>
		<body>
		<!-- Header -->
		<header>
			<nav>
				<a href="https://www.biblegateway.com/" class="adaptive-link">god may forgive us all</a>
				<button aria-label="Apps" class="icon-btn">
					<svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h4v4H3V3zm7 0h4v4h-4V3zM3 10h4v4H3v-4zm7 7h4v4h-4v-4zM10 3h4v4h-4V3zM17 3h4v4h-4V3zM17 10h4v4h-4v-4zM10 10h4v4h-4v-4zM3 17h4v4H3v-4zM17 17h4v4h-4v-4z"/></svg>
				</button>
				<a href="https://neal.fun/not-a-robot/" class="btn btn-primary">Are you a bot?</a>
			</nav>
		</header>

			<!-- Main -->
			<main>
				<div class="search-container">
				<h1 class="sr-only">Binggle — search the web</h1>

				<!-- Logo -->
				<div class="logo-container" style="margin-bottom: 2rem;">
					<span class="logo-letter" aria-hidden="true">
						<span class="text-blue-600">B</span>
						<span class="text-red-500">i</span>
						<span class="text-yellow-400">n</span>
						<span class="text-blue-600">g</span>
						<span class="text-green-500">g</span>
						<span class="text-red-500">l</span>
						<span class="text-yellow-400">e</span>
					</span>
				</div>

				<!-- Search -->
				<form action="https://www.bing.com/search" method="get" role="search">
					<label for="q" class="sr-only">Search</label>
					<div class="search-input-container">
						<svg width="24" height="24" class="text-gray-500 flex-shrink-0" style="margin-right: 0.75rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"></path></svg>
						<input id="q" name="q" type="search" class="search-input" placeholder="请问您今天要来点猫娘吗？" aria-label="Search Binggle" />
						<button type="button" aria-label="Voice search" class="icon-btn" style="margin-left: 0.75rem;">
							<svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zM5 11a7 7 0 0 0 14 0h-2a5 5 0 0 1-10 0H5zM12 19v3"/></svg>
						</button>
					</div>

					<div class="search-buttons">
						<button type="submit" class="btn btn-secondary">坐和放宽，开始Binggle！</button>
						<a href="https://gugugaga.net" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">咕咕嘎嘎？（社死警告！）</a>
					</div>
				</form>

				<!-- Quote underneath search area -->
				<p class="quote">知识归根结底由经验而来。 ——洛克</p>
			</div>
		</main>

		<!-- Footer -->
		<footer>
			<div class="footer-content">
				<div class="footer-links">
		                  <span class="text-red-500">Your data means nothing to the great capital!</span>
				</div>
				<div class="footer-links">
		                  <a href="https://github.com/godsboy404/WebLearn">YNU@20231120231</a>
					<a href="https://www.ynu.edu.cn/">云南大学</a>
					<a href="http://www.sei.ynu.edu.cn/">软件学院</a>
				</div>
			</div>
		</footer>

		<!-- "/" 键聚焦输入框 -->
		<script>
			(function(){
				const input = document.getElementById('q');
				window.addEventListener('keydown', function(e){
					if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA'){
						e.preventDefault(); input.focus();
					}
				});
			})();
		</script>

        <!-- Solving text color compatibility with background -->
		<style>
			/* Adaptive link fallback visuals */
			.adaptive-link {
				transition: color .15s ease, text-shadow .15s ease;
			}
			/* Fallback when JS cannot sample due to CORS: use overlay blending to remain visible */
			.adaptive-link.blend-fallback {
				color: white !important; /* default to white for contrast */
				mix-blend-mode: difference;
				text-shadow: 0 1px 1px rgba(0,0,0,0.35);
			}
			.adaptive-link.light {
				color: white !important;
				text-shadow: 0 1px 2px rgba(0,0,0,0.4);
			}
			.adaptive-link.dark {
				color: #111827 !important; /* gray-900 */
				text-shadow: none;
			}
		</style>

		<script>
			// Attempt to sample the page background at the location of the nav links
			(function(){
				const links = Array.from(document.querySelectorAll('.adaptive-link'));
				if (!links.length) return;

				// Helper to set class
				function setLight(link){ link.classList.remove('dark','blend-fallback'); link.classList.add('light'); }
				function setDark(link){ link.classList.remove('light','blend-fallback'); link.classList.add('dark'); }

				// Create an offscreen canvas to sample the background image
				const img = new Image();
				img.crossOrigin = 'anonymous';
				img.src = getComputedStyle(document.body).backgroundImage.replace(/url\((['"])?(.*?)\1\)/, '$2');
				img.onload = function(){
					try {
						const canvas = document.createElement('canvas');
						canvas.width = img.naturalWidth;
						canvas.height = img.naturalHeight;
						const ctx = canvas.getContext('2d');
						ctx.drawImage(img,0,0);

						links.forEach(link => {
							const r = link.getBoundingClientRect();
							// Map viewport coords to image coords
							const bgPos = getComputedStyle(document.body).backgroundPosition.split(' ');
							const posX = bgPos[0] || '50%';
							const posY = bgPos[1] || '50%';
							// For simplicity assume center positioning and cover sizing
							const scale = Math.max(canvas.width / window.innerWidth, canvas.height / window.innerHeight);
							const imgX = Math.floor((r.left + r.width/2 - (window.innerWidth/2)) * scale + canvas.width/2);
							const imgY = Math.floor((r.top + r.height/2 - (window.innerHeight/2)) * scale + canvas.height/2);

							if (imgX < 0 || imgY < 0 || imgX >= canvas.width || imgY >= canvas.height){
								setLight(link);
								return;
							}
							const px = ctx.getImageData(imgX, imgY, 1, 1).data;
							const luminance = (0.2126*px[0] + 0.7152*px[1] + 0.0722*px[2]) / 255;
							if (luminance < 0.5) setLight(link); else setDark(link);
						});
					} catch (err){
						// CORS or other issue sampling the image
						links.forEach(l => l.classList.add('blend-fallback'));
					}
				};
				img.onerror = function(){
					// If cannot load image (CORS or network), use blend fallback
					links.forEach(l => l.classList.add('blend-fallback'));
				};
			})();
		</script>
	</body>
</html>
